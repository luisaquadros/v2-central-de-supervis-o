name: Verificacao de prontidao da supervisao

on:
  push:
    branches:
      - main
      - fix/cloudflare-bun-compat-20261013
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    strategy:
      fail-fast: false
      matrix:
        bun: ['1.2.15', '1.4.3']
    name: Validar Bun ${{ matrix.bun }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Instalar dependencias
        run: bun install --frozen-lockfile
      - name: Checagem TypeScript
        run: bun run lint
      - name: Testes operacionais
        run: bun run test
      - name: Gerar versao de producao
        run: bun run build
