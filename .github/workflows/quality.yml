name: Verificacao de prontidao da supervisao

on:
  push:
    branches:
      - main
      - fix/cloudflare-bun-compat-20261013
      - fix/operacional-20261013-leituras-aulas-mobile
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Validar Node 24 e npm
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Checagem TypeScript
        run: npm run lint
      - name: Testes operacionais
        run: npm test
      - name: Gerar versao de producao
        run: npm run build
      - name: Validar Worker real (workerd) com planilha simulada
        run: npm run test:worker-real
      - name: Validar empacotamento Cloudflare Worker e Durable Object
        run: npx --yes wrangler@4 deploy --dry-run --outdir=/tmp/central-supervisao-worker-check
