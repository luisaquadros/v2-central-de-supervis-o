<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Central de Supervisão Acadêmica</title>
    <meta name="theme-color" content="#15233b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Supervisão" />
    <link rel="icon" href="/central-supervisao.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      try {
        const saved = localStorage.getItem('cs_visual_theme') || 'system';
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = saved === 'dark' || (saved === 'system' && prefersDark) ? 'dark' : 'light';
      } catch {}
    </script>
    <meta name="description" content="Aplicação web acadêmica para gestão e supervisão de estágios de Psicologia, com modo supervisão tablet-first, controle multi-semestre, frequência e pendências." />
    <meta property="og:title" content="Central de Supervisão" />
    <meta property="og:description" content="Aplicação web acadêmica para gestão e supervisão de estágios de Psicologia, com modo supervisão tablet-first, controle multi-semestre, frequência e pendências." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-slate-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
